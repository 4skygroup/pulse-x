<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E32323" />

    <!-- Primary SEO (overridden per page by react-helmet-async) -->
    <title>Pulse X | Social Creative Agency – Brand Content, Social Ads & Influence</title>
    <meta name="description" content="Pulse X is a social creative agency specializing in Brand Content, Social Ads and Influencer Marketing. We create impactful content to grow your brand on TikTok, Instagram, and Meta." />
    <link rel="canonical" href="https://pulsexagency.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse X Agency" />
    <meta property="og:title" content="Pulse X | Social Creative Agency – Brand Content, Social Ads & Influence" />
    <meta property="og:description" content="Pulse X is a social creative agency specializing in Brand Content, Social Ads and Influencer Marketing. We create impactful content to grow your brand on TikTok, Instagram, and Meta." />
    <meta property="og:url" content="https://pulsexagency.com/" />
    <meta property="og:image" content="https://pulsexagency.com/logoPulseX.png" />
    <meta property="og:image:alt" content="Pulse X Agency" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse X | Social Creative Agency – Brand Content, Social Ads & Influence" />
    <meta name="twitter:description" content="Pulse X is a social creative agency specializing in Brand Content, Social Ads and Influencer Marketing." />
    <meta name="twitter:image" content="https://pulsexagency.com/logoPulseX.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pulse X Agency",
      "url": "https://pulsexagency.com",
      "logo": "https://pulsexagency.com/logoPulseX.png",
      "description": "Social Creative Agency specializing in Brand Content, Social Ads and Influencer Marketing.",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Play To Sky Group",
        "url": "https://www.playtosky.com/"
      },
      "sameAs": [
        "https://www.linkedin.com",
        "https://www.instagram.com",
        "https://www.tiktok.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
